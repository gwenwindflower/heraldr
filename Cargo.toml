[package]
name = "heraldr"
version = "0.0.2"
edition = "2024"
description = "Reactive labels and chrome for Herdr tabs, workspaces, and agents"
readme = "README.md"
repository = "https://github.com/gwenwindflower/heraldr"
license = "GPL-3.0-or-later"
keywords = ["herdr", "herdr-plugin"]
categories = ["command-line-utilities"]
include = ["Cargo.lock", "Cargo.toml", "LICENSE", "README.md", "icons.conf", "src/**", "tests/*.rs"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
