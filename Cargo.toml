[package]
name = "heraldr"
version = "0.0.2"
edition = "2024"
description = "Herdr tab, workspace, and agent chrome: [N] <icon> <name> labels driven by the live session"
authors = ["Gwyneth Windflower"]
license = "GPL-3.0-or-later"
repository = "https://github.com/gwenwindflower/heraldr"
readme = "README.md"
keywords = ["herdr", "plugin", "terminal", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/*.rs", "icons.conf", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.clippy]
pedantic = "warn"
