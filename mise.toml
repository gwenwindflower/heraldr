[tools]
git-cliff = "latest"
pinact = "latest"
zizmor = "latest"
shellcheck = "latest"
prek = "latest"
rumdl = "latest"
jq = "latest"

# Rust
[tasks.build]
description = "Compile the optimized binary into target/release"
run = "cargo build --locked --release"

[tasks."dev:build"]
description = "Run standard build with pretty interactive output"
alias = "b"
run = "cargo pretty build --locked"
raw = true

[tasks.install]
description = "Install the checkout's binary on your PATH"
run = "cargo install --path . --locked --force"

[tasks.fmt]
description = "Rewrite every file to the rustfmt style"
run = "cargo fmt --all"

[tasks."lint:clippy"]
description = "Lint every target and feature, treating warnings as errors"
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks."test:rust"]
description = "Run the Rust test suite"
run = "cargo test --all-features --locked"

[tasks."dev:test"]
description = "Run the Rust tests with pretty interactive output"
alias = "t"
run = "cargo pretty test --all-features --locked"
raw = true

# Dependencies

[tasks."deps:check"]
description = "Preview compatible lockfile updates and dependency requirement upgrades, including breaking versions"
run = ["cargo update --dry-run", "cargo upgrade --dry-run --incompatible allow"]

[tasks."deps:update"]
description = "Update Cargo.lock to the latest versions allowed by Cargo.toml"
run = "cargo update"

[tasks."deps:audit"]
description = "Audit Cargo.lock for known vulnerabilities and yanked crates"
run = "cargo audit"

# Herdr
[tasks."herdr:link"]
description = "Point Herdr at the checkout, keeping herdr-plugin.toml and icons.conf local"
run = "herdr plugin link ."

[tasks."herdr:unlink"]
description = "Detach Herdr from the checkout, leaving the checkout itself alone"
run = "herdr plugin unlink heraldr"

[tasks."herdr:install"]
description = "Install the published plugin from GitHub"
run = "herdr plugin install gwenwindflower/heraldr"

[tasks."herdr:uninstall"]
description = "Remove the plugin from Herdr, leaving Heraldr's user config in place"
run = "herdr plugin uninstall heraldr"

[tasks."herdr:clear"]
description = "Stop the running watcher and remove Heraldr's display metadata"
run = "herdr plugin action invoke heraldr.clear"

[tasks."herdr:reset"]
description = "Adopt the current tab back into automatic naming after a manual rename"
run = "herdr plugin action invoke heraldr.reset"

[tasks."herdr:status"]
description = "Report how Herdr sees Heraldr: linked or installed, its version, events, and actions"
run = "herdr plugin list --plugin heraldr"

# Development loop

[tasks.dev]
description = "The local loop: every check, then a fresh build linked into Herdr"
alias = "d"
run = ["mise run check", "mise run dev:reload"]

[tasks."dev:reload"]
description = "Stop the watcher, install the checkout, and link it into Herdr"
run = ["mise run herdr:clear", "mise run install", "mise run herdr:link"]

[tasks."dev:local"]
description = "Replace a GitHub install with this checkout"
run = ["mise run herdr:clear", "mise run herdr:uninstall", "mise run install", "mise run herdr:link"]

[tasks."dev:released"]
description = "Replace the checkout with the published plugin, as a user receives it"
run = [
  "mise run herdr:clear",
  "mise run herdr:unlink",
  "cargo binstall heraldr --git https://github.com/gwenwindflower/heraldr",
  "mise run herdr:install",
]

# Tests

[tasks."test:manifest"]
description = "Validate the plugin manifest"
run = "./tests/plugin-manifest.sh"
deny_net = true
deny_write = true

[tasks."test:installer"]
description = "Test the installer with fake Cargo/Binstall in temporary directories; no downloads"
run = "./tests/install-binary.sh"

[tasks."test:versioning"]
description = "Exercise the version tasks against sandbox repositories"
run = "./tests/versioning.sh"

[tasks."test:workflows"]
description = "Verify automated gates select noninteractive tests without installing Heraldr"
run = "./tests/task-workflows.sh"

[tasks."test:publishing"]
description = "Test crate publication guards with fake Git and GitHub responses"
run = "bash tests/publishing.sh"

[tasks."test:packaging"]
description = "Verify release archives contain the binary and a matching checksum"
run = "bash tests/packaging.sh"

[tasks."test:build"]
description = "Verify the optimized binary builds"
depends = ["build"]

[tasks."test:crate"]
description = "Compile the packaged crate without uploading it"
run = "cargo package --locked --allow-dirty"

[tasks.test]
description = "Run every test suite"
depends = ["test:*"]

# Checks

[tasks."lint:hooks"]
description = "Run every prek hook against the whole tree, the same hooks each commit runs on staged files"
run = "prek run --all-files"

[tasks."hooks:install"]
description = "Install the prek commit and commit-msg hooks into this clone"
run = "prek install --hook-type pre-commit --hook-type commit-msg"

[tasks.check]
description = "Run local lint, version checks, and noninteractive test suites"
alias = "c"
depends = ["lint:*", "version:check", "test:*"]

[tasks."ci-audit:zizmor"]
description = "Audit the GitHub Actions workflows for security issues"
run = "zizmor ."
allow_write = ["~/.cache/zizmor"]

[tasks.ci-audit]
description = "Run both workflow audits"
alias = "ca"
depends = ["ci-audit:zizmor", "ci-audit:pinact"]

# Release

[tasks."release:bootstrap-crate"]
description = "Publish the first released crate using local Cargo credentials"
confirm = "Publish this release to crates.io using your local Cargo credentials?"
run = ["mise run release:crate-preflight", "cargo publish --locked"]

[tasks."release:check"]
description = "The full pre-release gate: every check plus both workflow audits"
depends = ["check", "ci-audit"]

[tasks."release:push"]
description = "Push the release commit to origin/main, where GitHub will tag it"
confirm = "Push the release commit to origin/main?"
run = "git push origin main"

[tasks."release:verify"]
description = "Inspect the published release, its build workflow, and its uploaded assets"
run = '''
version="$(gh release view --json tagName --jq '.tagName')"
gh release view "$version"
gh run list --workflow release-build.yml --limit 5
gh release view "$version" --json assets --jq '.assets[].name'
'''
