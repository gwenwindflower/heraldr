id = "livery"
name = "Livery"
version = "0.4.0"
min_herdr_version = "0.7.5"
description = "Dress herdr tabs as [N] <icon> <program> and feed sidebar rows composable tokens: $jump (workspace jump number) plus $space/$worktree (repo + nested worktree names for agent rows). Labels stay bare for the agents panel and navigator; manual renames win. Icons come from the hand-edited icons.conf manifest."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install-binary.sh"]

[[events]]
on = "workspace.created"
command = ["target/release/livery", "kick"]

[[events]]
on = "tab.created"
command = ["target/release/livery", "kick"]

[[events]]
on = "tab.focused"
command = ["target/release/livery", "kick"]

[[events]]
on = "pane.focused"
command = ["target/release/livery", "kick"]

[[events]]
on = "pane.agent_detected"
command = ["target/release/livery", "kick"]

[[actions]]
id = "reset"
title = "Livery: reset tab to automatic naming"
contexts = ["global"]
command = ["target/release/livery", "reset"]

[[actions]]
id = "clear"
title = "Livery: strip all chrome"
contexts = ["global"]
command = ["target/release/livery", "clear"]
