name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_id="$(cargo +stable pkgid --locked)"
          version="${package_id##*#}"
          version="${version##*@}"
          version="${version##*:}"
          if [[ "v${version}" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo package version ${version}." >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo +stable build --locked --release

      - name: Package release binary
        run: |
          package_id="$(cargo +stable pkgid --locked)"
          version="${package_id##*#}"
          version="${version##*@}"
          version="${version##*:}"
          package="livery-${{ matrix.target }}-v${version}"
          mkdir -p "dist/${package}"
          cp target/release/livery "dist/${package}/livery"
          tar -C dist -czf "dist/${package}.tgz" "${package}"
          cd dist
          shasum -a 256 "${package}.tgz" > "${package}.tgz.sha256"

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: livery-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/*.tgz.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: livery-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Livery $GITHUB_REF_NAME"
          fi
