name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build without uploading assets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false # This workflow publishes release artifacts; a poisoned cache would reach users.

      - name: Verify release version
        run: mise run version:check "$RELEASE_TAG"

      - name: Build release binary
        run: mise run build

      - name: Package release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          package="heraldr-${TARGET}-v$(mise run version:cargo)"
          mkdir -p "dist/${package}"
          cp target/release/heraldr "dist/${package}/heraldr"
          tar -C dist -czf "dist/${package}.tgz" "${package}"
          cd dist
          shasum -a 256 "${package}.tgz" > "${package}.tgz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heraldr-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/*.tgz.sha256
          if-no-files-found: error

  publish:
    name: Upload release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to attach build artifacts to the published release.
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: heraldr-*
          path: dist
          merge-multiple: true

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
